<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperación de Contraseña - Smile Cloud</title>
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='CSS/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='CSS/login.css') }}">
  <!-- NUEVO: estilos de alertas -->
  <link rel="stylesheet" href="{{ url_for('static', filename='CSS/alertas.css') }}">
</head>

<body>
  <div class="login-wrapper">
    <div class="login-container text-center">
      
      <!-- LOGO ANIMADO (Muela flotante) -->
      <div class="login-logo">
        <img src="{{ url_for('static', filename='imagenes/logoSC.png') }}" alt="Logo Smile Cloud" class="img-fluid floating-logo">
      </div>
      
      <h1 class="login-title">Smile Cloud</h1>
      <p class="login-subtitle">Sistema de Gestión Odontológica</p>

      <!-- NUEVO: la caja amarilla se reemplazó por una alerta SweetAlert2 (ver script al final) -->

      <!-- BOTÓN CON DEGRADADO PARA REGRESAR -->
      <a href="{{ url_for('login') }}" id="btnVolverLogin" class="btn btn-gradient w-100 py-2 shadow-sm text-decoration-none d-block mt-4">
        Volver al inicio de sesión
      </a>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>

  <!-- NUEVO: SweetAlert2 y funciones de alertas -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
  <script src="{{ url_for('static', filename='JS/alertas.js') }}"></script>

  <!-- NUEVO: aviso de restablecimiento de acceso -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var volver = document.getElementById('btnVolverLogin');

      scAviso(
        'Restablecimiento de acceso',
        'La recuperación automática de contraseña no está disponible desde esta aplicación. ' +
        'Si olvidó su contraseña, comuníquese directamente con el administrador del sistema para solicitar un nuevo acceso.',
        'info',
        'Volver al inicio de sesión'
      ).then(function () {
        if (volver) { window.location.href = volver.getAttribute('href'); }
      });
    });
  </script>
</body>
</html>
