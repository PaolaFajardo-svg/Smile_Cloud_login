<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Paciente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/editar_paciente.css') }}">
</head>

<body>

<main class="pagina-formulario-paciente">

    <section class="encabezado-pagina-formulario">

        <div>
            <span class="titulo-pequeno">
                Gestión clínica
            </span>

            <h1>
                Editar paciente
            </h1>

            <p>
                Actualice la información del paciente y guarde los cambios.
            </p>
        </div>

        <a href="/pacientes" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i>
            Volver a pacientes
        </a>

    </section>


    <form action="/actualizar/{{ paciente.id_paciente }}" method="POST" class="formulario-paciente-pagina">


        <!-- ================= INFORMACIÓN DEL PACIENTE ================= -->

        <section class="seccion-formulario">

            <div class="titulo-seccion">

                <i class="bi bi-person"></i>

                Información del paciente

            </div>


            <div class="row g-3">

                <div class="col-md-4">

                    <label>Tipo de documento *</label>

                    <select name="tipo_documento" class="form-select" required>
                        <option value="CC" {% if paciente.tipo_documento == 'CC' %}selected{% endif %}>
                            Cédula de ciudadanía
                        </option>
                        <option value="TI" {% if paciente.tipo_documento == 'TI' %}selected{% endif %}>
                            Tarjeta de identidad
                        </option>
                        <option value="CE" {% if paciente.tipo_documento == 'CE' %}selected{% endif %}>
                            Cédula de extranjería
                        </option>
                        <option value="PAS" {% if paciente.tipo_documento == 'PAS' %}selected{% endif %}>
                            Pasaporte
                        </option>
                    </select>

                </div>


                <div class="col-md-4">

                    <label>Número de documento *</label>

                    <input
                        type="text"
                        name="numero_documento"
                        class="form-control"
                        value="{{ paciente.numero_documento }}"
                        required>

                </div>


                <div class="col-md-4">

                    <label>Fecha de nacimiento</label>

                    <input
                        type="date"
                        name="fecha_nacimiento"
                        class="form-control"
                        value="{{ paciente.fecha_nacimiento }}">

                </div>


                <div class="col-md-4">

                    <label>Nombre *</label>

                    <input
                        type="text"
                        name="nombre"
                        class="form-control"
                        value="{{ paciente.nombre }}"
                        required>

                </div>


                <div class="col-md-4">

                    <label>Apellido *</label>

                    <input
                        type="text"
                        name="apellido"
                        class="form-control"
                        value="{{ paciente.apellido }}"
                        required>

                </div>


                <div class="col-md-4">

                    <label>Sexo</label>

                    <select name="sexo" class="form-select">
                        <option value="Femenino" {% if paciente.sexo == 'Femenino' %}selected{% endif %}>
                            Femenino
                        </option>
                        <option value="Masculino" {% if paciente.sexo == 'Masculino' %}selected{% endif %}>
                            Masculino
                        </option>
                        <option value="Otro" {% if paciente.sexo == 'Otro' %}selected{% endif %}>
                            Otro
                        </option>
                    </select>

                </div>

            </div>

        </section>


        <!-- ================= CONTACTO ================= -->

        <section class="seccion-formulario">

            <div class="titulo-seccion">

                <i class="bi bi-telephone"></i>

                Información de contacto

            </div>


            <div class="row g-3">

                <div class="col-md-4">

                    <label>Teléfono</label>

                    <input
                        type="text"
                        name="telefono"
                        class="form-control"
                        value="{{ paciente.telefono }}">

                </div>


                <div class="col-md-4">

                    <label>Correo</label>

                    <input
                        type="email"
                        name="correo"
                        class="form-control"
                        value="{{ paciente.correo }}">

                </div>


                <div class="col-md-4">

                    <label>Dirección</label>

                    <input
                        type="text"
                        name="direccion"
                        class="form-control"
                        value="{{ paciente.direccion }}">

                </div>

            </div>

        </section>


        <!-- ================= EPS ================= -->

        <section class="seccion-formulario">

            <div class="titulo-seccion">

                <i class="bi bi-shield-check"></i>

                Seguridad social

            </div>


            <div class="row g-3">

                <div class="col-md-4">

                    <label>EPS</label>

                    <input
                        type="text"
                        name="eps"
                        class="form-control"
                        value="{{ paciente.eps }}">

                </div>

            </div>

        </section>


        <!-- ================= BOTONES ================= -->

        <div class="acciones-formulario">

            <a
                href="/pacientes"
                class="btn btn-secondary">

                Cancelar

            </a>


            <button
                type="submit"
                class="btn btn-success">

                <i class="bi bi-check-lg"></i>

                Guardar cambios

            </button>

        </div>

    </form>

</main>

</body>
</html>
